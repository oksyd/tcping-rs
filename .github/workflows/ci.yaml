name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.verify.outputs.version }}
      toolchain:
        value: ${{ jobs.verify.outputs.toolchain }}
      revision:
        value: ${{ jobs.verify.outputs.revision }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    outputs:
      version: ${{ steps.package.outputs.version }}
      toolchain: ${{ steps.package.outputs.toolchain }}
      revision: ${{ steps.package.outputs.revision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read package and validate tag
        id: package
        run: |
          python3 - <<'PY'
          import os, subprocess, tomllib
          with open("Cargo.toml", "rb") as source:
              package = tomllib.load(source)["package"]
          version, toolchain = package["version"], package["rust-version"]
          ref = os.environ["GITHUB_REF"]
          if ref.startswith("refs/tags/") and ref[10:] not in (version, f"v{version}"):
              raise SystemExit(f"Tag {ref[10:]} does not match package version {version}")
          revision = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key, value in dict(version=version, toolchain=toolchain, revision=revision).items():
                  assert "\n" not in value and "\r" not in value
                  print(f"{key}={value}", file=output)
          PY
      - name: Skip Rust checks for documentation-only changes
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* || -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            echo "check=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE" HEAD -- . ':(glob,exclude)**/*.md' ':(exclude)LICENSE'; then
            echo "check=false" >> "$GITHUB_OUTPUT"
          else
            echo "check=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust toolchain
        if: steps.changes.outputs.check == 'true'
        env:
          RUST_VERSION: ${{ steps.package.outputs.toolchain }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV"
      - name: Cache Cargo registry
        if: steps.changes.outputs.check == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ steps.package.outputs.toolchain }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-${{ steps.package.outputs.toolchain }}-
      - name: Cache compiled checks
        if: steps.changes.outputs.check == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/debug/
          key: checks-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.package.outputs.toolchain }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            checks-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.package.outputs.toolchain }}-
      - name: Format, lint and documentation
        if: steps.changes.outputs.check == 'true'
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo doc --no-deps --all-features --locked
      - name: Test supported features
        if: steps.changes.outputs.check == 'true'
        run: |
          cargo test --locked
          cargo test --no-default-features --locked
          cargo test --no-default-features --features report --locked
      - name: Test Linux SYN packets on loopback
        if: steps.changes.outputs.check == 'true'
        run: |
          cargo test --test syn --no-run --locked --message-format=json > "$RUNNER_TEMP/syn-tests.json"
          syn_tests=$(python3 -c 'import json, sys; records = [json.loads(line) for line in open(sys.argv[1])]; print(next(r["executable"] for r in records if r.get("reason") == "compiler-artifact" and r["target"]["name"] == "syn" and r.get("executable")))' "$RUNNER_TEMP/syn-tests.json")
          sudo --non-interactive "$syn_tests" --ignored
