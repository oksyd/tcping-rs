name: Prepare release draft

on:
  push:
    tags: ['[0-9]*', 'v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TAG: ${{ github.ref_name }}
  CROSS_VERSION: v0.2.5
  CROSS_X86_64_UNKNOWN_LINUX_MUSL_SHA256: a486cefa6cb486971b97be321ea9dfc2e90c1979550295314a368f53fab6d588
  GIT_CLIFF_VERSION: v2.12.0
  GIT_CLIFF_X86_64_UNKNOWN_LINUX_MUSL_SHA256: c89a7bc55f3c51f391938aa3fa560125109695c1930d927879daea68dd786420

jobs:
  check:
    uses: ./.github/workflows/ci.yaml

  build:
    needs: check
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact-count: ${{ format('{0}', strategy.job-total) }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            cross: false
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            cross: false
          - os: ubuntu-24.04
            target: arm-unknown-linux-gnueabihf
            cross: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            cross: false
          - os: ubuntu-24.04
            target: armv7-unknown-linux-gnueabihf
            cross: true
          - os: macos-15
            target: aarch64-apple-darwin
            cross: false
          - os: windows-2025
            target: x86_64-pc-windows-gnu
            cross: false
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            cross: false
    env:
      VERSION: ${{ needs.check.outputs.version }}
      RUSTUP_TOOLCHAIN: ${{ needs.check.outputs.toolchain }}
      TARGET: ${{ matrix.target }}
      USE_CROSS: ${{ matrix.cross }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.check.outputs.revision }}
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target "$TARGET"
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-${{ env.RUSTUP_TOOLCHAIN }}-
      - name: Install native musl toolchain
        if: ${{ contains(matrix.target, 'musl') }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - name: Install MinGW toolchain
        if: ${{ matrix.target == 'x86_64-pc-windows-gnu' }}
        shell: powershell
        run: choco install mingw --no-progress --yes
      - name: Install cross
        if: ${{ matrix.cross }}
        run: |
          archive="cross-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/cross-rs/cross/releases/download/${CROSS_VERSION}/${archive}"
          dir="${RUNNER_TEMP}/cross"
          mkdir -p "$dir" "$HOME/.local/bin"
          curl --fail --show-error --silent --location --retry 3 "$url" -o "$dir/$archive"
          echo "$CROSS_X86_64_UNKNOWN_LINUX_MUSL_SHA256  $dir/$archive" | sha256sum -c -
          tar -xzf "$dir/$archive" -C "$dir"
          install "$dir/cross" "$HOME/.local/bin/cross"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Test Windows and macOS
        if: ${{ matrix.target == 'x86_64-pc-windows-msvc' || runner.os == 'macOS' }}
        run: cargo test --release --locked --target "$TARGET"
      - name: Build
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          if [[ "$USE_CROSS" == "true" ]]; then
            cross build --release --locked --target "$TARGET"
          else
            cargo build --release --locked --target "$TARGET"
          fi
      - name: Smoke test native binary
        if: ${{ !matrix.cross }}
        run: |
          bin="target/$TARGET/release/tcping"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            bin="$bin.exe"
          fi
          test "$("$bin" --version)" = "tcping $VERSION"
          "$bin" --help
      - name: Check static musl binary
        if: ${{ contains(matrix.target, 'musl') }}
        run: |
          readelf --program-headers "target/$TARGET/release/tcping" > headers.txt
          if grep -q INTERP headers.txt; then
            echo "::error::musl binary requires a dynamic loader and cannot run in scratch."
            exit 1
          fi
      - name: Package
        id: package
        run: |
          staging="tcping-$TARGET"
          bin="tcping"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            bin="$bin.exe"
          fi
          mkdir "$staging"
          cp README.md LICENSE "$staging/"
          cp "target/$TARGET/release/$bin" "$staging/"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            asset="$staging.zip"
            7z a "$asset" "$staging" >/dev/null
          else
            asset="$staging.tar.gz"
            tar czf "$asset" "$staging"
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binary-${{ matrix.target }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  draft:
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      REVISION: ${{ needs.check.outputs.revision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.check.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        env:
          EXPECTED_ASSETS: ${{ needs.build.outputs.artifact-count }}
        run: |
          shopt -s nullglob
          assets=(tcping-*.tar.gz tcping-*.zip)
          test "${#assets[@]}" -eq "$EXPECTED_ASSETS"
          printf '%s\n' "${assets[@]}" | LC_ALL=C sort | xargs sha256sum > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Install git-cliff
        run: |
          version="${GIT_CLIFF_VERSION#v}"
          archive="git-cliff-$version-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/orhun/git-cliff/releases/download/$GIT_CLIFF_VERSION/$archive"
          dir="$RUNNER_TEMP/git-cliff"
          mkdir -p "$dir" "$HOME/.local/bin"
          curl --fail --show-error --silent --location --retry 3 "$url" -o "$dir/$archive"
          echo "$GIT_CLIFF_X86_64_UNKNOWN_LINUX_MUSL_SHA256  $dir/$archive" | sha256sum -c -
          tar -xzf "$dir/$archive" -C "$dir"
          install "$dir/git-cliff-$version/git-cliff" "$HOME/.local/bin/git-cliff"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Generate changelog
        run: git-cliff --config cliff.toml --latest --tag "$TAG" --strip header -o RELEASE_NOTES.md
      - name: Prepare draft for manual publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq '.sha')" = "$REVISION"
          release=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" |
            jq -sc --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)] | first // empty')
          if [[ -n "$release" ]] && [[ "$(jq -r '.draft' <<< "$release")" != true ]]; then
            echo "Release $TAG is already published; leaving it unchanged."
            exit 0
          fi
          prerelease=false
          if [[ "${VERSION%%+*}" == *-* ]]; then prerelease=true; fi
          if [[ -z "$release" ]]; then
            gh release create "$TAG" --verify-tag --target "$REVISION" --draft \
              --prerelease="$prerelease" --title "tcping $TAG" --notes-file RELEASE_NOTES.md
          else
            gh release edit "$TAG" --title "tcping $TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --clobber
          echo "Draft ready. Review and publish it manually on GitHub."
