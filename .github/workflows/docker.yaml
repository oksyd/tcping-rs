name: Publish release image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-release-image
  queue: max

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - name: Package released binaries and push to GHCR
        shell: bash
        run: |
          version="${TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)*$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tcping"
          build="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release download "$TAG" --dir dist \
            --pattern "tcping-x86_64-unknown-linux-musl.tar.gz" \
            --pattern "tcping-aarch64-unknown-linux-musl.tar.gz" \
            --pattern SHA256SUMS
          (cd dist && sha256sum --check --ignore-missing SHA256SUMS)

          printf '%s\n' 'FROM scratch' 'COPY tcping /usr/local/bin/tcping' \
            'USER 65532:65532' 'ENTRYPOINT ["/usr/local/bin/tcping"]' > "$RUNNER_TEMP/Dockerfile"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_REPOSITORY_OWNER" --password-stdin
          trap 'docker logout ghcr.io' EXIT

          digests=()
          for arch in amd64 arm64; do
            target=x86_64-unknown-linux-musl
            if [[ "$arch" == arm64 ]]; then target=aarch64-unknown-linux-musl; fi
            staging="tcping-$target"
            mkdir -p "$arch"
            tar -xzf "dist/$staging.tar.gz" -C "$arch" --strip-components=1 "$staging/tcping"
            tag="$image:build-$build-$arch"
            docker build --platform "linux/$arch" --file "$RUNNER_TEMP/Dockerfile" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.version=$version" \
              --tag "$tag" "$arch"
            if [[ "$arch" == amd64 ]]; then
              test "$(docker run --rm "$tag" --version)" = "tcping $version"
            fi
            docker push "$tag"
            digests+=("$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')")
          done
          docker buildx imagetools create --tag "$image:${version//+/_}" "${digests[@]}"
          if [[ "$PRERELEASE" == false ]] && \
            [[ "$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')" == "$TAG" ]]; then
            docker buildx imagetools create --tag "$image:latest" "${digests[@]}"
          fi
