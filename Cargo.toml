[package]
name = "tcping"
description = "🛠️ tcping-rs: Rust (rs) TCP Ping (tcping) Utility for Port Reachability."
version = "1.3.2"
edition = "2024"
rust-version = "1.100.0"
license = "Apache-2.0"
authors = ["oksyd<oksyd@outlook.com>"]
repository = "https://github.com/oksyd/tcping-rs"
documentation = "https://github.com/oksyd/tcping-rs/blob/main/README.md"
include = [
  "src/**",
  "tests/**",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSE",
]

[features]
default = ["cli"]
cli = ["report", "dep:clap", "dep:anstream", "dep:serde_json", "tokio/signal"]
report = ["dep:serde", "dep:time"]

[[bin]]
name = "tcping"
path = "src/bin/tcping/main.rs"
required-features = ["cli"]

[dependencies]
anstream = { version = "1.0.0", optional = true, default-features = false, features = ["auto", "wincon"] }
clap = { version = "4.6.7", optional = true, default-features = false, features = ["std", "color", "usage", "help", "suggestions", "error-context", "derive"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "net", "time", "sync"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"] }
serde = { version = "1.0.229", optional = true, default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", optional = true, default-features = false, features = ["std"] }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
time = { version = "0.3.55", optional = true, default-features = false, features = ["std", "formatting"] }

[target.'cfg(target_os = "linux")'.dependencies]
socket2 = { version = "0.6.5", features = ["all"] }
getrandom = "0.4.3"

[dev-dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["test-util"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 1

[package.metadata.release]
tag-prefix = ""
tag-name = "{{prefix}}{{version}}"
pre-release-commit-message = "chore: release {{crate_name}} version {{version}}"
tag-message = "chore: release {{crate_name}} version {{version}}"
pre-release-hook = ["git", "cliff", "-o", "CHANGELOG.md", "--tag", "{{version}}"]
